# Complete SLA proxy example with independent log and HTTP destinations.
# Defaults to observe-only: no Valkey connection, runtime sinks or HTTP credentials.
# To deliver, configure Valkey and the HTTP endpoint, set the credential variables,
# and enable BOTH durable.enabled and delivery.enabled below.
listen_address: ":9012" # Bind a private/loopback address or use a protected reverse proxy.
webhook_path: /webhook
max_body_bytes: 1048576
shutdown_timeout: 10s
evaluation_horizon_days: 370 # Local dates searched; 1–3660, not permanent ineligibility.

# First nonempty matching label selects its independent policy map; no fallback
# for unknown values. Policies do not select sinks: every occurrence freezes all sinks.
sla_definitions:
  - sla_label: sla_id
    slas:
      business-hours-se:
        timezone: Europe/Stockholm
        schedule:
          monday: ["08:00-12:00", "13:00-17:00"]
          tuesday: ["08:00-17:00"]
          wednesday: ["08:00-17:00"]
          thursday: ["08:00-17:00"]
          friday: ["08:00-17:00"]
        holidays:
          # Explicit dates work alone. For public holidays, install an ICS/manifest
          # pair and uncomment dataset (see docs/sla-proxy/holiday-datasets.md).
          # dataset: /etc/alert-sla-proxy/holiday-data/current/holidays_se.ics
          additional_dates: ["2027-12-24"]
  - sla_label: sla_name
    slas:
      # This name belongs to this entry; it does not reuse the policy above.
      business-hours-se:
        timezone: Europe/Stockholm
        schedule:
          monday: ["09:00-18:00"]
          tuesday: ["09:00-18:00"]
          wednesday: ["09:00-18:00"]
          thursday: ["09:00-18:00"]
          friday: ["09:00-18:00"]

durable:
  enabled: false
  policy_epoch: 1 # Increase for approved policy changes, sink additions or enable/disable.
  valkey:
    address: "127.0.0.1:6379"
    username: ""
    password_env: "" # For authentication, name an environment variable here.
    database: 0
    namespace: sla # Use a dedicated namespace; retain its registries on restart.
    tls: false # Set true to use TLS with system CA roots; no insecure-skip option.
  scheduler:
    poll_interval: 1s
    workers: 4
    batch_size: 100
    lease_duration: 30s
    operation_timeout: 5s
    retry_initial: 5s
    retry_max: 5m
    reconcile_interval: 30s
  # Repeats do not extend retention; unresolved/outstanding/held work may live longer.
  retention:
    completed_payload: 720h # 30 days after first durable resolution receipt.
    tombstone: 2160h       # 90 days after first durable resolution receipt.

delivery:
  enabled: false
  sinks:
    # Placeholder remote endpoint: replace before enabling delivery. Destination
    # URL/type/timeout/auth-reference changes are rejected once registered.
    - id: incident_management_system
      type: http
      http:
        url: https://sn.acme.se/api/sn_em_connector/em/inbound_event?source=prometheus
        timeout: 10s
        basic_auth:
          username: "${SERVICENOW_USERNAME}"
          password: "${SERVICENOW_PASSWORD}"
        idempotency_key: true # Optional; defaults to true. Backend support is not assumed.
    - id: audit
      type: log
  # Advanced shared worker/retry tuning; minimal examples omit these defaults.
  dispatcher:
    poll_interval: 1s
    workers: 4
    batch_size: 100
    claim_lease: 30s
    delivery_timeout: 10s
    retry_initial: 5s
    retry_max: 5m
