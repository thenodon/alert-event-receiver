# Persist and schedule without delivery; remaining settings use defaults.
sla_definitions:
  - sla_label: sla_id
    slas:
      demo:
        timezone: UTC
        schedule:
          monday: ["00:00-24:00"]
          tuesday: ["00:00-24:00"]
          wednesday: ["00:00-24:00"]
          thursday: ["00:00-24:00"]
          friday: ["00:00-24:00"]
          saturday: ["00:00-24:00"]
          sunday: ["00:00-24:00"]

durable:
  enabled: true
  valkey:
    address: "127.0.0.1:6380" # Local disposable Valkey from getting started.
    namespace: documentation-state # Independent demo state, not a migration strategy.
