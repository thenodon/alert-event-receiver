# Local Go HTTP mock plus audit logs. Never use the demo credentials remotely.
# Run go run ./cmd/httpsink-mock -listen 127.0.0.1:8080 with MOCK_USERNAME/MOCK_PASSWORD.
# Set matching SERVICENOW_USERNAME/SERVICENOW_PASSWORD for the proxy, as in the guide.
sla_definitions:
  - sla_label: sla_id
    slas:
      demo:
        timezone: UTC
        schedule:
          monday: ["00:00-24:00"]
          tuesday: ["00:00-24:00"]
          wednesday: ["00:00-24:00"]
          thursday: ["00:00-24:00"]
          friday: ["00:00-24:00"]
          saturday: ["00:00-24:00"]
          sunday: ["00:00-24:00"]

durable:
  enabled: true
  valkey:
    address: "127.0.0.1:6380" # Local disposable Valkey from getting started.
    namespace: documentation-http # Independent demo state, not a migration strategy.

delivery:
  enabled: true
  sinks:
    - id: servicenow # A stable logical ID; the payload is generic Alertmanager JSON.
      type: http
      http:
        url: http://127.0.0.1:8080/inbound_event?source=prometheus
        timeout: 10s # Required for each explicit HTTP sink; shared defaults cover it.
        basic_auth:
          username: "${SERVICENOW_USERNAME}"
          password: "${SERVICENOW_PASSWORD}"
    - id: audit
      type: log
